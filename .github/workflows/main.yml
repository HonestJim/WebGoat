on: [push]
 
jobs:
  sigma_analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    continue-on-error: true
    # Skip this job when the required proprietary DockerHub credentials for
    # the sigsynopsys/sigma-release-image are not provisioned in this
    # environment. Without them the container cannot be pulled and the job
    # fails at the "Starting job container" step. This is an infrastructure
    # concern (private image access), not a code/dependency issue.
    if: ${{ vars.RUN_SIGMA_ANALYSIS == 'true' }}
    container:
      image: sigsynopsys/sigma-release-image:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_SIGSYNOPSYS_USERNAME }}
        password: ${{ secrets.DOCKERHUB_SIGSYNOPSYS_PASSWORD }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
 
      - name: SIGMA analysis
        run: sigma -j4 analyze --format sarif .
 
      - name: Upload SARIF file
        uses: actions/upload-artifact@v4
        with:
          name: sigma-results
          path: sigma-results.json
